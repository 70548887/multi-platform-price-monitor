name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: price_monitor
          POSTGRES_PASSWORD: ci-local-fixture
          POSTGRES_DB: price_monitor_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U price_monitor -d price_monitor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://price_monitor:ci-local-fixture@127.0.0.1:55432/price_monitor_test
      TEST_REDIS_URL: redis://127.0.0.1:56379/15
      DATABASE_URL: postgresql+psycopg://price_monitor:ci-local-fixture@127.0.0.1:55432/price_monitor_test
      REDIS_URL: redis://127.0.0.1:56379/15
      SESSION_SECRET: ci-only-session-secret-with-at-least-thirty-two-characters
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      ADMIN_PASSWORD: ci-only-fixture-password
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Validate official tag, synchronized versions and release notes
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            python scripts/validate_release.py --tag "$GITHUB_REF_NAME" --revision "$GITHUB_SHA"
          else
            python scripts/validate_release.py --revision "$GITHUB_SHA"
          fi
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run isolated backend and operational tests
        run: python -m pytest -q backend/tests scripts/tests
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Check out audited four-service baseline for compatibility drill
        uses: actions/checkout@v4
        with:
          ref: v1.2.1
          path: .runtime/baseline
          persist-credentials: false
      - name: Preserve existing AI data through current Docker upgrade and rollback
        run: python scripts/docker_update_smoke.py --run --report .runtime/docker-ai-current-smoke.json
      - name: Upgrade audited four-service release to five services and roll back
        run: python scripts/docker_update_smoke.py --run --baseline-root .runtime/baseline --report .runtime/docker-ai-smoke.json
      - name: Save sanitized Docker acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-ai-smoke-evidence
          path: |
            .runtime/docker-ai-smoke.json
            .runtime/docker-ai-current-smoke.json
          if-no-files-found: warn
          retention-days: 7
      - name: Build and independently verify allowlisted release
        run: |
          python scripts/package_release.py --revision "$GITHUB_SHA"
          python scripts/validate_release.py --revision "$GITHUB_SHA" --assets dist/releases --notes-output dist/releases/release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: test-and-package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/releases
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Recheck artifact provenance before publishing
        run: python scripts/validate_release.py --tag "$GITHUB_REF_NAME" --revision "$GITHUB_SHA" --assets dist/releases --notes-output dist/releases/release-notes.md
      - name: Upload draft, verify uploaded bytes, then publish formal Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="price-monitor-${version}.tar.gz"
          tag_commit="$(gh api "repos/$GH_REPO/commits/$GITHUB_REF_NAME" --jq .sha)"
          test "$tag_commit" = "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" "dist/releases/$package" "dist/releases/$package.sha256" --draft --verify-tag --target "$GITHUB_SHA" --notes-file dist/releases/release-notes.md --title "PriceScope $GITHUB_REF_NAME"
          gh release download "$GITHUB_REF_NAME" --dir verified-upload --pattern "$package" --pattern "$package.sha256"
          python scripts/validate_release.py --tag "$GITHUB_REF_NAME" --revision "$GITHUB_SHA" --assets verified-upload
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
