name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: price_monitor
          POSTGRES_PASSWORD: ci-local-fixture
          POSTGRES_DB: price_monitor_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U price_monitor -d price_monitor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://price_monitor:ci-local-fixture@127.0.0.1:55432/price_monitor_test
      TEST_REDIS_URL: redis://127.0.0.1:56379/15
      DATABASE_URL: postgresql+psycopg://price_monitor:ci-local-fixture@127.0.0.1:55432/price_monitor_test
      REDIS_URL: redis://127.0.0.1:56379/15
      SESSION_SECRET: ci-only-session-secret-with-at-least-thirty-two-characters
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      ADMIN_PASSWORD: ci-only-fixture-password
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run isolated backend and operational tests
        run: python -m pytest -q backend/tests scripts/tests
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Validate tag and build allowlisted release
        run: python scripts/package_release.py --version "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/releases/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist/releases
      - name: Publish tested GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/releases/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
