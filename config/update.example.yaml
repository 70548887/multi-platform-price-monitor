# Copy to config/update.yaml for local deployment.
# Use encrypted system settings for overseas mode; UPDATE_PROXY only applies to custom mode.
# Keep the GitHub Token in UPDATE_GITHUB_TOKEN.
update:
  enabled: true
  github_owner: "70548887"
  github_repo: "multi-platform-price-monitor"
  github_token: "${UPDATE_GITHUB_TOKEN:-}"
  check_interval: 0
  proxy: "${UPDATE_PROXY:-}"
  proxy_route: "overseas"              # overseas: system settings; custom: UPDATE_PROXY; direct: no proxy
  auto_download: false
  auto_restart: true
  backup_dir: "./data/backups"
  release_asset_pattern: "price-monitor-{version}.tar.gz"
