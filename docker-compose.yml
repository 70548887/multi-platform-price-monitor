name: price-monitor

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      APP_UID: ${APP_UID:-10001}
      APP_GID: ${APP_GID:-10001}
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-price_monitor}:${POSTGRES_PASSWORD:?Run python scripts/init_env.py}@db:5432/${POSTGRES_DB:-price_monitor}
    REDIS_URL: redis://redis:6379/0
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run python scripts/init_env.py}
    SESSION_SECRET: ${SESSION_SECRET:?Run python scripts/init_env.py}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run python scripts/init_env.py}
    UPDATE_GITHUB_TOKEN: ${UPDATE_GITHUB_TOKEN:-}
    UPDATE_PROXY: ${UPDATE_PROXY:-}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    TZ: Asia/Shanghai
  restart: unless-stopped
  init: true
  user: "${APP_UID:-10001}:${APP_GID:-10001}"
  volumes:
    - ./data/update:/app/data/update
    - ./config/update.yaml:/app/config/update.yaml:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-price_monitor}
      POSTGRES_DB: ${POSTGRES_DB:-price_monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/init_env.py}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *backend
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000']
    healthcheck:
      test: [CMD, python, /app/container_health.py, api]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker:
    <<: *backend
    command: [celery, -A, 'app.tasks:celery_app', worker, --loglevel=info, --concurrency=2, '--hostname=worker@%h']
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'celery -A app.tasks:celery_app inspect ping --destination "worker@$$HOSTNAME" --timeout 5 | grep -q pong']
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    stop_grace_period: 60s

  beat:
    <<: *backend
    command: [celery, -A, 'app.tasks:celery_app', beat, --loglevel=info, --max-interval=30, --schedule=/tmp/celerybeat-schedule, --pidfile=/tmp/celerybeat.pid]
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, /app/container_health.py, beat]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-28671}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/healthz']
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
